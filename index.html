<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biologie Toests</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff0000 0%, #ffffff 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: rgb(0, 0, 0);
            margin-bottom: 50px;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .content-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            color: #cc0000;
            margin-bottom: 20px;
            font-size: 1.8em;
            border-bottom: 3px solid #cc0000;
            padding-bottom: 10px;
        }

        .resource-list {
            list-style: none;
        }

        .resource-item {
            margin-bottom: 15px;
        }

        .resource-link {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #333;
            transition: all 0.3s ease;
            border-left: 4px solid #cc0000;
        }

        .resource-link:hover {
            background: #cc0000;
            color: white;
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .icon {
            width: 30px;
            height: 30px;
            margin-right: 15px;
            font-size: 24px;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .media-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .media-card:hover {
            border-color: #cc0000;
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .media-link {
            text-decoration: none;
            color: #333;
            display: block;
        }

        .media-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 50px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Biologie toest</h1>
            <p class="subtitle">oefen voor de toets</p>
        </header>

        <div class="content-section">
            <h2>PDF Documenten</h2>
            <ul class="resource-list">
                <li class="resource-item">
                    <a href="Trainingsmodule.pdf" class="resource-link" target="_blank">
                        <span>Trainingsmodule</span>
                    </a>
                </li>
                <li class="resource-item">
                    <a href="Studiegids.pdf" class="resource-link" target="_blank">
                        <span>Studiegids</span>
                    </a>
                </li>
                <li class="resource-item">
                    <a href="Een Gids voor Beginners.pdf" class="resource-link" target="_blank">
                        <span>Een Gids voor Beginners</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="content-section">
            <h2>Media Bestanden</h2>
            <div class="media-grid">
                <div class="media-card">
                    <a href="video.mp4" class="media-link" target="_blank">
                        <strong>Video</strong>
                    </a>
                </div>
                <div class="media-card">
                    <a href="podcast.m4a" class="media-link" target="_blank">
                        <strong>Podcast</strong>
                    </a>
                </div>
                <div class="media-card">
                    <a href="mind map.png" class="media-link" target="_blank">
                        <strong>Mind Map</strong>
                    </a>
                </div>
            </div>
        </div>

        <footer>
            <p></p>
        </footer>
    </div>
</body>
</html>
